# Lint configuration, written down rather than inherited.
#
# WHY THIS FILE EXISTS. There was no ruff configuration here and CI installed
# ruff unpinned (`pip install pytest pyyaml ruff`), so `ruff check src` ran
# whatever rule set the newest ruff release happened to default to. When that
# default widened, the build went red on `main` with no commit behind it and
# stayed red. A gate that can fail without anyone changing the code is not
# telling you about the code.
#
# The selection below is ruff's classic default (pycodestyle errors plus
# Pyflakes), which is what this repository was written against and which it
# passes cleanly. It is now stated explicitly, so a future ruff release changes
# the version but not the verdict. The CI workflow pins the ruff version to
# match; the two go together, and neither alone is enough.
#
# Widening this is a deliberate act: add a rule, fix what it finds, commit both
# together. That is a different thing from having a rule appear on its own.

line-length = 100
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
