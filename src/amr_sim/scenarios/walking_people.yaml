# Pedestrians walking fixed legs, back and forth, on VERIFIED FREE FLOOR.
#
# Lane endpoints are taken from positions already confirmed clear: the
# static_people scenario placed people at (4.0,-1.0), (2.0,-3.2), (-0.5,-1.0)
# and (3.0,-1.8) and all four rested correctly on the ground and were detected
# in every frame.
#
# This matters more than it sounds. Earlier lanes ran through the racking, and
# because the velocity plugin overwrites the whole velocity vector every tick a
# walker that rode up onto the clutter could never fall back: three of them
# ended up hovering between 0.27 and 0.35 m with nothing underneath. One also
# walked through the robot and shoved it 2.2 m. A scenario must not put people
# inside the scenery and must not move the vehicle under test.
#
# The driver reverses on MEASURED displacement rather than a timer, so a walker
# cannot drift out of its lane whatever time it spawned.

name: walking_people
description: Three pedestrians walking the open aisle, one stationary worker

people:
  # Crosses the robot's path: the case the safety layer exists for.
  - name: walker_crossing
    x: 3.0
    y: -3.4
    yaw: 1.5708
    path: {length: 2.0, speed: 1.2}

  # Along the aisle, stopping short of the vehicle.
  - name: walker_aisle
    x: -0.5
    y: -1.0
    yaw: 0.0
    path: {length: 1.5, speed: 1.0}

  # Slow walker further down the aisle.
  - name: walker_slow
    x: 2.0
    y: -3.6
    yaw: 1.5708
    path: {length: 1.6, speed: 0.6}

  # A worker standing at a station. Deliberately included: a stationary person
  # is the case the motion test CANNOT distinguish from structure.
  - name: worker_standing
    x: 3.0
    y: -1.8
    yaw: 3.14159
