# Pedestrians walking fixed straight legs, back and forth.
#
# Open loop and deterministic on purpose. The driver computes each traverse from
# the leg length and the speed and reverses on a timer, so two runs of this
# scenario produce the same motion. Closed-loop steering would introduce
# run-to-run variation into a file whose whole job is to make runs comparable.
#
# Speeds are ordinary walking pace. A person at 1.4 m/s crossing in front of a
# robot at 2.0 m/s is the case the safety layer has to handle.

name: walking_people
description: Three pedestrians walking, one stationary worker

people:
  # Walks across the aisle in front of the robot: the crossing case.
  - name: walker_crossing
    x: 4.0
    y: -3.0
    yaw: 1.5708
    path: {length: 4.0, speed: 1.3}

  # Walks along the aisle, away and back.
  - name: walker_aisle
    x: 0.0
    y: -2.0
    yaw: 0.0
    path: {length: 3.5, speed: 1.0}

  # Slow walker behind the robot, on a lane that CLEARS the vehicle.
  #
  # This path used to run from (-1.0, -1.0) straight along y = -1.0, which is
  # the robot's own row. A velocity-controlled pedestrian does not respond to
  # contact, so it simply shoved the 97 kg robot 2.2 m backwards. Scenarios must
  # not move the vehicle under test unless that is the thing being tested.
  - name: walker_slow
    x: -1.0
    y: 0.2
    yaw: 0.0
    path: {length: 2.5, speed: 0.6}

  # A worker standing at a station. Deliberately included: a stationary person
  # is the case the motion test CANNOT distinguish from structure, and leaving
  # it out would flatter the result.
  - name: worker_standing
    x: 3.0
    y: -0.2
    yaw: 3.14159
