# Pedestrians wandering randomly on floor the robot has actually mapped.
#
# There are no lanes here any more, and that is the point. The driver picks a
# random goal for each walker and accepts it only if the straight line to it is
# clear in the occupancy map, with a clearance radius around every sample along
# the way. A route through a rack is rejected before it is walked rather than
# ending in a collision the physics engine has to sort out. Unknown cells count
# as blocked, so the figures stay on floor that has actually been observed.
#
# Earlier versions encoded hand-guessed lane endpoints, and two of three walkers
# spawned inside the racking. The scenario no longer needs to know anything about
# the warehouse layout.
#
# Motion is seeded (see the driver's `seed` parameter) so a run replays
# identically. Random has to be repeatable or detection numbers measured against
# this scenario cannot be compared between runs.
#
# SPAWN POINTS ARE CLEAR OF THE VEHICLE, which starts at about (2.0, -1.0).
# They used to be 1 to 2 m from it, and because walkers also had no idea the
# vehicle existed, one passed within 0.38 m of it and one was inside 1.5 m for
# 31 percent of the run. Every resulting protective stop was correct, and
# together they held the vehicle stopped 46 percent of the time at an average
# 0.03 m/s: it could not leave its parking spot, so nothing else in the stack
# was ever exercised. Spawning them clear fixes the departure without telling
# them anything about where the vehicle goes afterwards.
#
# WALKERS STOP FOR THE VEHICLE AND STAND THEIR GROUND. They do not steer around
# it and they are not stopped from walking into its path, so the robot has to
# plan around a person standing in an aisle and then carry on to the station it
# was already going to. That is the case this scenario exists to produce; see
# the note beside `robot_response` in pedestrian_driver.py for the two earlier
# models and why both of them made the result meaningless.
#
# This does NOT mean the protective stop goes untested. It is tested by the
# scenario written to test it, where a pedestrian crosses the vehicle's path
# deliberately, rather than by three people permanently standing on it.

name: walking_people
description: Three pedestrians wandering the mapped floor, one stationary worker

people:
  - name: walker_a
    x: 0.0
    y: -6.0
    yaw: 1.57
    wander: {speed: 1.1, range: 6.0}

  - name: walker_b
    x: -3.0
    y: -4.0
    yaw: 0.0
    wander: {speed: 0.8, range: 6.0}

  - name: walker_c
    x: -3.1
    y: 3.0
    yaw: 3.14159
    wander: {speed: 1.3, range: 6.0}

  # A worker standing at a station. Deliberately included: a stationary person
  # is the case the motion test CANNOT distinguish from structure, so leaving it
  # out would flatter the tracker's numbers.
  - name: worker_standing
    x: -3.5
    y: -1.0
    yaw: 3.14159
