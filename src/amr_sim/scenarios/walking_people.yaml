# Pedestrians walking fixed legs, back and forth, on lanes MEASURED to be clear.
#
# The lanes are not guessed. They were read off the live merged scan by probing
# a grid of world points for 0.5 m of clearance:
#
#     y \ x    -1   0   1   2   3   4   5
#     -1.0      O   X   O   O   X   X   X      <- the robot sits at (2, -1)
#     -1.6      O   X   O   O   X   O   X
#     -2.2      O   O   O   O   X   O   X
#     -2.8      O   O   O   O   X   O   X
#     -3.4      O   O   O   O   X   O   X
#     -4.0      O   O   O   O   X   O   X
#
# x = 3 is blocked at every row, and that is precisely where two walkers and the
# standing worker had been placed by guesswork: they spawned inside the clutter,
# which is why they never moved and why one ended up hovering. x = -1 to 2 is a
# clear run at any y below -2, and x = 4 is a clear column below y = -1.6.

name: walking_people
description: Three pedestrians on measured-clear lanes, one stationary worker

people:
  # Long lane down the open aisle.
  - name: walker_aisle
    x: -1.0
    y: -2.2
    yaw: 0.0
    path: {length: 3.0, speed: 1.0}

  # Parallel lane, slower.
  - name: walker_slow
    x: -1.0
    y: -3.4
    yaw: 0.0
    path: {length: 3.0, speed: 0.6}

  # Crosses the aisle up the clear column at x = 4.
  - name: walker_crossing
    x: 4.0
    y: -4.0
    yaw: 1.5708
    path: {length: 2.4, speed: 1.2}

  # A worker standing at a station. Deliberately included: a stationary person
  # is the case the motion test CANNOT distinguish from structure.
  - name: worker_standing
    x: 1.0
    y: -1.6
    yaw: 3.14159
