# Pedestrian scenario: people at fixed, known positions.
#
# Scenarios are spawned into the running world rather than written into it,
# because worlds/warehouse.sdf is GENERATED by tools/import_aws_warehouse.py and
# anything added there is destroyed on the next import. Keeping people in a
# scenario also makes runs comparable: the same file gives the same layout.
#
# Poses are in the world frame, which equals the map frame.
#
# This first scenario is deliberately static. Detection does not need motion;
# tracking does, and that comes with the moving scenarios. Fixed positions mean
# every detection can be scored against a known truth rather than against a
# guess.

name: static_people
description: Four stationary pedestrians around the robot's spawn point

people:
  # Directly ahead of the robot, in the open aisle.
  - {name: person_ahead, x: 4.0, y: -1.0, yaw: 3.14159}
  # Off to one side, at the range where the warning field will sit.
  - {name: person_side, x: 2.0, y: -3.2, yaw: 1.5708}
  # Behind, so the rear scanner has something to find too.
  - {name: person_behind, x: -0.5, y: -1.0, yaw: 0.0}
  # Close in, inside what will become the protective field.
  - {name: person_close, x: 3.0, y: -1.8, yaw: 3.14159}
