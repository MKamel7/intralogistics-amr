# MiR250-class AMR platform specification.
#
# Single source of truth for every physical constant of the robot. The xacro
# description reads `values`, and nothing in the URDF may hardcode a dimension
# that belongs here.
#
# This describes a *class* of machine derived from a published specification. It
# is not a model of any vendor's product and carries no vendor branding. See
# docs/adr/0002-mir250-class-reference-platform.md.
#
# EVERY key under `values` must have a matching entry under `provenance`, and
# test/test_platform_spec.py fails the build if one is missing, extra, or
# carries an unknown source kind. The four kinds are:
#
#   datasheet  taken directly from an archived data sheet, with the section
#   derived    computed from datasheet values (the arithmetic is stated)
#   estimated  not published anywhere; an engineering estimate, with reasoning
#   tuned      chosen so the model reproduces a published figure, named in `check`
#
# Data sheets are in docs/datasheets/. Section references point at the
# `pdftotext -layout` extraction beside each PDF so they can be grepped.

platform:
  id: mir250_class
  description: 250 kg class differential-drive AMR for indoor intralogistics
  reference: MiR250 (Mobile Industrial Robots A/S), public specification

values:
  # ---- chassis -------------------------------------------------------
  chassis_length: 0.800          # m
  chassis_width: 0.580           # m
  chassis_height: 0.300          # m
  top_plate_height: 0.300        # m, the deck itself
  vehicle_envelope_height: 1.200 # m, vehicle plus the load it carries
  ground_clearance: 0.026        # m
  # Corner recesses that house the safety scanners. Without them the scanners
  # sit INSIDE a solid chassis box and the vehicle stops occluding its own
  # lidar, see docs/validation.md.
  corner_cut_x: 0.120            # m
  corner_cut_y: 0.090            # m
  tare_mass: 83.0                # kg, without battery or payload
  battery_mass: 14.0             # kg
  max_payload: 250.0             # kg

  # ---- drive ---------------------------------------------------------
  drive_wheel_radius: 0.100      # m
  drive_wheel_width: 0.050       # m
  wheel_separation: 0.450        # m
  caster_wheel_radius: 0.0625    # m
  caster_wheel_width: 0.040      # m
  caster_inset_x: 0.300          # m, from robot centre to caster axis
  caster_inset_y: 0.230          # m
  caster_swivel_offset: 0.030    # m, trail from swivel axis to wheel axis

  # ---- component masses ----------------------------------------------
  # The chassis mass is NOT listed here: it is computed in the description as
  # (tare_mass + battery_mass) minus everything below, so the total always
  # equals the published figure no matter what the component estimates are.
  drive_wheel_mass: 3.0          # kg, each
  caster_wheel_mass: 0.8         # kg, each
  caster_swivel_mass: 0.5        # kg, each
  scanner_mass: 0.67             # kg, each
  camera_mass: 0.072             # kg, each
  imu_mass: 0.02                 # kg
  beacon_mass: 0.15              # kg, signal light

  # ---- sensor body dimensions (for visual and inertial proxies) -------
  scanner_body_x: 0.107          # m
  scanner_body_y: 0.080          # m
  scanner_body_z: 0.118          # m
  camera_body_x: 0.025           # m
  camera_body_y: 0.090           # m
  camera_body_z: 0.025           # m

  # ---- motion limits -------------------------------------------------
  max_linear_speed: 2.0          # m/s
  max_reverse_speed: 0.30        # m/s
  max_linear_accel: 0.3          # m/s^2, at maximum payload
  max_linear_accel_unladen: 1.0  # m/s^2, no payload
  max_angular_speed: 1.5         # rad/s
  max_incline: 0.05              # fraction, at 0.5 m/s

  # ---- emergency braking, for protective field sizing ------------------
  # A protective field is only as good as the stopping distance behind it, and
  # that distance is a calculation, not a choice. See docs/safety_concept.md.
  emergency_decel: 1.50          # m/s^2
  brake_actuation_delay: 0.05    # s
  control_latency: 0.10          # s, sensor to command; NOT YET MEASURED

  # ---- energy --------------------------------------------------------
  battery_capacity_kwh: 1.63
  battery_nominal_voltage: 47.7  # V
  battery_capacity_ah: 34.2
  battery_cycles: 3000

  # ---- safety laser scanners (2x, diagonally opposite corners) --------
  scanner_scan_angle: 275.0      # deg
  scanner_angular_resolution: 0.17   # deg
  scanner_samples: 1618          # rays across the aperture
  scanner_protective_range: 3.0  # m
  scanner_warning_range: 10.0    # m
  scanner_measuring_range: 40.0  # m
  scanner_response_time: 0.070   # s
  scanner_detection_resolution: 0.020   # m
  scanner_protective_supplement: 0.065  # m
  scanner_mount_height: 0.150    # m above ground, scan plane
  # Optical centre, flush at the envelope corner and 5 mm proud of it. See the
  # note in sensors.xacro: recessed anywhere inboard of this and the vehicle's
  # own sides block the tangential view, which measured as an 11.6 degree blind
  # sector in the merged scan.
  scanner_mount_x: 0.405         # m, from robot centre
  scanner_mount_y: 0.295         # m
  scanner_housing_inset: 0.060   # m, housing drawn inboard of the optics
  # Margin the self-return filter must add to the chassis envelope.
  #
  # The scanner pods stand proud of the published envelope by 28.7 mm, because
  # the optics sit flush at the corner and the housing is a box rotated 45
  # degrees. At the previous 20 mm margin those pod returns survived the filter,
  # landed inside the protective field, and the vehicle STOPPED FOR ITSELF and
  # never moved. Derived, with 6 mm over the requirement.
  self_filter_margin: 0.060      # m
  scanner_update_rate: 14.28     # Hz, rounded DOWN from 1/70 ms; see provenance

  # ---- 3D cameras (2x) -----------------------------------------------
  # PER CAMERA, from the Intel sheet. The platform sheet's 114 deg is the
  # COMBINED figure for the pair, not one camera; see camera_splay below and
  # V-09 in docs/validation.md.
  camera_hfov: 87.0              # deg
  camera_vfov: 58.0              # deg
  camera_min_depth: 0.105        # m
  camera_max_range: 10.0         # m
  camera_splay: 13.5             # deg, each camera toed out from straight ahead
  camera_fov_height: 1.800       # m, at the distance below
  camera_fov_distance: 1.200     # m, in front of the robot
  camera_min_ground_view: 0.250  # m
  camera_mount_height: 0.270     # m
  camera_mount_y: 0.150          # m, lateral offset of each camera
  camera_update_rate: 15.0       # Hz

# Published figures the model is validated AGAINST rather than tuned to.
# Phase 5 and Phase 2 assert these; see test/ and the KPI harness.
validation_targets:
  corridor_width_default: 1.350      # m
  corridor_width_dynamic: 1.000      # m
  corridor_width_90_turn: 0.950      # m, muted protective fields
  doorway_width_default: 1.300       # m
  min_object_at_1m: 0.020            # m
  min_object_at_2p5m: 0.070          # m
  distance_to_max_speed: 9.5         # m
  camera_combined_hfov: 114.0        # deg, MiR sheet; the pair must span this
  runtime_loaded_h: 13.0
  runtime_unloaded_h: 17.4
  runtime_standby_h: 22.0

# Certification figures of the reference scanner. Recorded because the safety
# concept quotes them; the simulation reproduces the TIMING, never the integrity.
safety_reference:
  scanner_performance_level: PL d      # EN ISO 13849
  scanner_category: 3                  # EN ISO 13849
  scanner_sil: 2                       # IEC 61508
  scanner_type: 3                      # IEC 61496
  scanner_mission_time_years: 20
  vehicle_standards: [EN 1525, ISO 3691-4, ANSI B56.5, ANSI R15.08]
  ambient_temp_range_c: [5, 40]        # ISO 3691-4 section 4.1.2

provenance:
  chassis_length:      {kind: datasheet, src: "MiR250 sheet, Dimensions/Length 800 mm"}
  chassis_width:       {kind: datasheet, src: "MiR250 sheet, Dimensions/Width 580 mm"}
  top_plate_height:    {kind: estimated, src: "not published separately. This platform has no raised mounting profile above the deck, unlike the MP-400 whose manual distinguishes H1 411 mm from H2 381 mm, so the load rests on the 300 mm chassis top itself and the two figures coincide. Carried as its own key anyway so the payload geometry is platform general rather than assuming every vehicle is this one"}
  chassis_height:      {kind: datasheet, src: "MiR250 sheet, Dimensions/Height 300 mm"}
  vehicle_envelope_height: {kind: estimated, src: "NOT published as a single figure, and it is not the 300 mm chassis height. This platform exists to carry a top module, so the height that must clear an overhead obstruction is the deck plus the load standing on it. 1200 mm covers a typical KLT stack or shelf-lifter module on a 250 kg class AMR. It matters because it is what the camera obstacle layer is configured from: the vehicle drove UNDER warehouse racking, which its 150 mm scan plane reads as a row of thin legs with drivable gaps between them, and wedged at 0.400 m clearance against a 0.501 m inscribed radius. Occupied area at robot height is 16.4 m2 against 108.7 m2 at person height, so the scanner is blind to roughly 85 percent of what should block this vehicle. If a real top module is specified this figure must be taken from it"}
  ground_clearance:    {kind: derived,   src: "MiR250 sheet gives a 25 to 28 mm range; midpoint taken"}
  corner_cut_x:        {kind: estimated, src: "not published; sized so a scanner body fits in the recess and the remaining chassis still occludes the sensor's inward arc"}
  corner_cut_y:        {kind: estimated, src: "not published; sized so a scanner body fits in the recess and the remaining chassis still occludes the sensor's inward arc"}
  tare_mass:           {kind: datasheet, src: "MiR250 sheet, Weight without battery or payload 83 kg"}
  battery_mass:        {kind: datasheet, src: "MiR250 sheet, Battery weight 14 kg"}
  max_payload:         {kind: datasheet, src: "MiR250 sheet, Maximum payload 250 kg"}

  drive_wheel_radius:  {kind: derived,   src: "MiR250 sheet, drive wheel diameter 200 mm, halved"}
  drive_wheel_width:   {kind: estimated, src: "not published; 50 mm is typical for a 250 kg class drive wheel and only affects contact patch and visuals"}
  wheel_separation:    {kind: estimated, src: "not published; 450 mm centres inside the 580 mm body leaves room for hub motors and matches the class"}
  caster_wheel_radius: {kind: derived,   src: "MiR250 sheet, caster wheel diameter 125 mm, halved"}
  caster_wheel_width:  {kind: estimated, src: "not published; proportionate to a 125 mm caster"}
  caster_inset_x:      {kind: estimated, src: "not published; placed inside the 800 mm length to give a stable rectangle around the drive axis"}
  caster_inset_y:      {kind: estimated, src: "not published; placed inside the 580 mm width clear of the drive wheels"}
  caster_swivel_offset: {kind: estimated, src: "not published; a caster needs trail to self-align, and 30 mm is typical for a 125 mm wheel"}

  drive_wheel_mass:    {kind: estimated, src: "not published; a driven 200 mm wheel with hub motor, chosen so the pair stays a small fraction of the 97 kg total"}
  caster_wheel_mass:   {kind: estimated, src: "not published; proportionate to a 125 mm undriven caster"}
  caster_swivel_mass:  {kind: estimated, src: "not published; the swivel fork and bearing, chosen small because it only affects yaw response of the caster"}
  scanner_mass:        {kind: datasheet, src: "SICK nanoScan3 sheet, Weight 0.67 kg"}
  beacon_mass:         {kind: estimated, src: "not published; a small LED signal beacon, chosen light because it sits high and only affects the tipping calculation"}
  imu_mass:            {kind: estimated, src: "not published; a MEMS IMU module, small enough that it is bookkeeping rather than dynamics"}
  scanner_body_x:      {kind: datasheet, src: "SICK nanoScan3 sheet, Dimensions W x H x D 106.6 mm, rounded to 107 mm"}
  scanner_body_y:      {kind: datasheet, src: "SICK nanoScan3 sheet, Dimensions W x H x D, height 80 mm"}
  scanner_body_z:      {kind: datasheet, src: "SICK nanoScan3 sheet, Dimensions W x H x D, depth 117.5 mm, rounded to 118 mm"}
  camera_body_x:       {kind: datasheet, src: "Intel RealSense D435i sheet, Length x Depth x Height 90 mm x 25 mm x 25 mm, depth 25 mm"}
  camera_body_y:       {kind: datasheet, src: "Intel RealSense D435i sheet, Length x Depth x Height 90 mm x 25 mm x 25 mm, length 90 mm"}
  camera_body_z:       {kind: datasheet, src: "Intel RealSense D435i sheet, Length x Depth x Height 90 mm x 25 mm x 25 mm, height 25 mm"}
  camera_mass:         {kind: estimated, src: "not published in EITHER sheet; the Intel sheet gives dimensions but no mass, so this is estimated from the 90 x 25 x 25 mm module. An earlier version of this line claimed it was the published mass, which was wrong before the Intel sheet was archived"}

  max_linear_speed:    {kind: datasheet, src: "MiR250 sheet, Maximum speed 2.0 m/s"}
  max_reverse_speed:   {kind: estimated, src: "NOT published. The MiR sheet quotes one maximum speed and does not distinguish direction. 0.30 m/s is chosen deliberately low because the 3D cameras face forward, so a reversing vehicle detects with the 2D scan plane alone and cannot see an object that starts above 150 mm. It sizes the rear protective field and is the reason reversing is discouraged rather than forbidden"}
  max_linear_accel:    {kind: datasheet, src: "MiR250 sheet, Acceleration limits with maximum payload 0.3 m/s2"}
  max_linear_accel_unladen: {kind: estimated, src: "NOT published. The sheet quotes 0.3 m/s2 explicitly as the limit WITH MAXIMUM PAYLOAD, which is a load-retention figure: it exists so a 250 kg load does not slide, not because the drive cannot do better. Using it unladen has a concrete cost. MPPI generates its candidate trajectories under this bound, and at 0.3 m/s2 with a 0.05 s step every one of the 2000 samples is within 0.015 m/s of the last command, so the trajectory set has almost no diversity in its first steps and the optimiser has no gradient to work with. Measured: a valid 167-pose plan in hand, commanding 0.014 m/s and going nowhere. 1.0 m/s2 is a conservative unladen rate for a 250 kg class indoor vehicle and stays well inside the 1.5 m/s2 emergency braking rate the protective fields are sized on. The laden figure above remains the one to use when a payload is carried, and choosing between them by load state is an outstanding item in docs/validation.md"}
  max_angular_speed:   {kind: estimated, src: "not published; chosen so a spot turn stays inside the 950 mm 90 degree corridor target"}
  max_incline:         {kind: datasheet, src: "MiR250 sheet, Maximum incline/decline 5 percent at 0.5 m/s"}

  emergency_decel:         {kind: estimated, src: "NOT published in either sheet. The MiR sheet gives an acceleration LIMIT of 0.3 m/s2, which is a comfort and payload-retention figure for normal driving and is not an emergency braking rate; using it would oversize every protective field by a factor of five. 1.5 m/s2 is a conservative emergency rate for a wheeled indoor vehicle on a dry floor. This is the single least-supported number in the safety calculation and it is called out in docs/safety_concept.md"}
  brake_actuation_delay:   {kind: estimated, src: "not published; the delay between a stop command and torque actually falling, taken as one control period plus margin"}
  control_latency:         {kind: estimated, src: "NOT YET MEASURED, and the earlier version of this line claimed it was, which was false. It is an estimate of the sensor-to-command path: merge, collision monitor cycle and transport. It feeds the protective field size directly, so measuring it end to end on the running system is an outstanding item recorded in docs/validation.md, and the safety concept must not claim a measured latency until it is"}
  battery_capacity_kwh:    {kind: datasheet, src: "MiR250 sheet, Battery capacity 1.63 kWh"}
  battery_nominal_voltage: {kind: datasheet, src: "MiR250 sheet, Battery voltage 47.7 V nominal"}
  battery_capacity_ah:     {kind: datasheet, src: "MiR250 sheet, Battery capacity 34.2 Ah at 47.7 V"}
  battery_cycles:          {kind: datasheet, src: "MiR250 sheet, Number of full charging cycles minimum 3000"}

  scanner_scan_angle:            {kind: datasheet, src: "SICK nanoScan3 sheet, Scanning angle 275 deg"}
  scanner_angular_resolution:    {kind: datasheet, src: "SICK nanoScan3 sheet, Angular resolution 0.17 deg"}
  scanner_samples:               {kind: derived,   src: "275 deg / 0.17 deg = 1617.6, rounded up to 1618"}
  scanner_protective_range:      {kind: datasheet, src: "SICK nanoScan3 sheet, Protective field range 3 m"}
  scanner_warning_range:         {kind: datasheet, src: "SICK nanoScan3 sheet, Warning field range 10 m"}
  scanner_measuring_range:       {kind: datasheet, src: "SICK nanoScan3 sheet, Distance measuring range 40 m"}
  scanner_response_time:         {kind: datasheet, src: "SICK nanoScan3 sheet, Response time 70 ms"}
  scanner_detection_resolution:  {kind: datasheet, src: "SICK nanoScan3 sheet, Resolution configurable, 20 mm setting chosen; matches the MiR250 sheet claim of a 20 mm object at 1000 mm"}
  scanner_protective_supplement: {kind: datasheet, src: "SICK nanoScan3 sheet, Protective field supplement 65 mm"}
  scanner_mount_height:          {kind: estimated, src: "not published; 150 mm puts the 80 mm tall scanner body inside the 300 mm chassis with the scan plane low enough to see a foot"}
  scanner_mount_x:               {kind: estimated, src: "not published; diagonally opposite corners, inside the 800 mm length"}
  scanner_mount_y:               {kind: estimated, src: "not published; diagonally opposite corners, inside the 580 mm width"}
  self_filter_margin:            {kind: measured,  src: "was 0.035, derived as 28.7 mm from the scanner housing geometry: a 107 x 80 mm box rotated 45 degrees about a mount 5 mm proud of the corner, which reaches beyond the envelope in both axes. That derivation was not wrong, it was incomplete. MEASURED on the running system, the vehicle returns hits on its own structure at 0.440 m from centre, which is 40 mm beyond the 0.400 m half length and therefore 11 mm outside the derived margin. The evidence is unambiguous: 12 of 12 protective stops in one transport run came from a return at exactly 0.440 m, minimum equal to median equal to maximum, always forward, and absent from BOTH costmaps. A real obstacle gives varying ranges and appears in the costmap; fixed geometry does neither. 0.060 m covers the measured 40 mm with room, and the derived figure is kept in this note because the discrepancy is worth understanding before the margin is trusted on hardware"}
  scanner_housing_inset:         {kind: estimated, src: "not published; the housing is drawn inboard of the optical centre so the body sits in the corner recess while the optics stay flush, which is how a corner-mounted safety scanner is packaged"}
  scanner_update_rate:           {kind: derived,   src: "1 / 70 ms response time = 14.2857 Hz, rounded DOWN to 14.28. Rounding a protective device UP claims it reports faster than it responds, which flatters every stopping distance computed from it, so the direction of the rounding is deliberate"}

  camera_hfov:              {kind: datasheet, src: "Intel RealSense D435i sheet, Depth Field of View 87 deg +/- 3 deg horizontal"}
  camera_vfov:              {kind: datasheet, src: "Intel RealSense D435i sheet, Depth Field of View 58 deg +/- 1 deg vertical"}
  camera_min_depth:         {kind: datasheet, src: "Intel RealSense D435i sheet, Minimum Depth Distance Min-Z 0.105 m"}
  camera_max_range:         {kind: datasheet, src: "Intel RealSense D435i sheet, Maximum Range approximately 10 metres"}
  camera_splay:             {kind: derived,   src: "(114 - 87) / 2 = 13.5 deg, the toe-out at which two 87 deg cameras span the 114 deg combined figure the MiR sheet publishes"}
  camera_mount_y:           {kind: estimated, src: "not published; lateral spacing chosen so the two cameras clear each other on the front face"}
  camera_fov_height:        {kind: datasheet, src: "MiR250 sheet, 3D cameras FoV height 1800 mm"}
  camera_fov_distance:      {kind: datasheet, src: "MiR250 sheet, FoV distance in front of robot 1200 mm"}
  camera_min_ground_view:   {kind: datasheet, src: "MiR250 sheet, FoV minimum distance for ground view 250 mm"}
  camera_mount_height:      {kind: estimated, src: "not published; just below the 300 mm deck so the stated 1800 mm at 1200 mm geometry is reproducible"}
  camera_update_rate:       {kind: estimated, src: "not published; 15 Hz is a deliberate CPU budget choice for the perception tier, see ADR 0003"}
