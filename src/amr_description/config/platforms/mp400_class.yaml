# Neobotix MP-400 class platform.
#
# A SECOND platform, and its purpose is architectural as much as practical. The
# platform spec, the field generator and the robot description all claim to be
# parameterised by this file. One instance is a claim; two is a demonstration.
#
# WHY THIS PLATFORM
#
# CORRECTED. The first version of this note claimed the test warehouse had
# 1.35 m aisles, that this left the MiR250 only 0.348 m of slack, and that
# nearly every marginal clearance failure traced back to it. That was wrong.
# The 1.35 m came from `corridor_width_default` in the MiR250 DATASHEET, which
# is the corridor width MiR quote for their vehicle, and it was repeated as
# though it were a measurement of this building.
#
# Measured on the ground truth map at robot height, the building's corridors
# have a median width of 1.34 m and a 75th percentile of 2.30 m. What the two
# platforms actually buy:
#
#   MiR250, circumscribed diameter 1.002 m -> reaches 63.2 percent of the floor
#   MP-400, circumscribed diameter 0.813 m -> reaches 67.8 percent of the floor
#
# Five percentage points, not a transformation. The MP-400 is still the smaller
# and easier vehicle in this building, but it is NOT the fix for the clearance
# failures, and the cause of those remains unknown. Do not carry the old claim
# forward.
#
# The reasons to have this platform that survive the correction: it proves the
# platform abstraction is real rather than asserted, it is German and ROS
# native, and its documentation is an OPERATING MANUAL rather than a sales
# brochure, which gives the chassis, the drive and the castors to the
# millimetre where the MiR250 sheet gives a silhouette.
#
# SOURCE
#
#   docs/datasheets/neobotix_mp400_operating_instructions_2022-07-20.pdf
#   Neobotix GmbH, MP-400 Operating Instructions, 20 July 2022.
#   Section 1.3 Mechanical Properties, tables 1.3.1 to 1.3.4.
#
# WHAT IS DELIBERATELY UNCHANGED
#
# The SENSOR SUITE is the same as the MiR250 build: SICK nanoScan3 safety
# scanners and Intel RealSense D435i cameras. The MP-400 ships with its own
# laser scanners, and the manual quotes them at 0.5 degree resolution over
# plus or minus 135 degrees, but it does not state a safety rating, a response
# time or a protective field capability. The whole safety concept in this
# project rests on a rated device with a published response time, so swapping in
# an unrated scanner to save a line of config would quietly invalidate it.
#
# Changing one variable at a time is the point: this file changes the VEHICLE,
# not the sensing. Sensor entries below therefore carry the same provenance they
# carry in mir250_class.yaml, because they describe the same parts.
#
# THE MANUAL'S LS1 AND LS2 POSITIONS ARE NOT USED, AND THAT IS THE POINT
#
# Section 1.3.3 locates a front scanner at x = 230 mm and a rear scanner at
# x = -354 mm, both on the centre line, to the millimetre. Those are the
# positions of THE MP-400'S OWN laser scanners, the unrated ones the paragraph
# above explains this project does not fit. Reading them across to a nanoScan3
# mount is a category error: it takes the geometry of one sensor as the
# geometry of a different sensor that is not there.
#
# It is not a harmless one. A centre-line pair and a corner pair are different
# safety concepts. The corner mount is what lets two 275 degree apertures cover
# a full turn with the optics grazing both adjacent faces; a pair on the centre
# line is occluded fore and aft by the vehicle's own body, and nothing in the
# description, the self filter or the field generator is built for it.
#
# So the nanoScan3 pair is mounted here the way it is mounted on the MiR250
# build, at diagonally opposite corners with the optics 5 mm proud of the
# chamfer, and scanner_mount_x and scanner_mount_y are ESTIMATED, exactly as
# they are on that platform. The manual's figures are recorded in the
# provenance so the next reader can see they were considered and why they were
# not taken.
#
# DRIVEN, BUT NOT VALIDATED. The navigation stack is now generated from this
# file, as the protective fields already were, so the vehicle no longer gets a
# correct body and another machine's tuning. It brings up, passes preflight and
# drives, and it completes 1 of 5 transport cycles against a same-day MiR250
# control of 5 of 5, driving two to four times the distance between the same two
# stations. The cause is open. See V-25 in docs/validation.md, and do not
# describe this platform as working.

platform: mp400_class

values:
  # ---- Chassis, from section 1.3.1 Dimensions -------------------------
  chassis_length: 0.590          # m, L1 overall length of platform
  chassis_width: 0.559           # m, W1 maximum width
  chassis_height: 0.411          # m, H1 height of mounting profiles
  vehicle_envelope_height: 1.000 # m, vehicle plus the load it carries
  ground_clearance: 0.044        # m, G
  corner_cut_x: 0.060            # m, the chamfer visible in Fig. 2
  corner_cut_y: 0.060            # m

  # ---- Drive ----------------------------------------------------------
  drive_wheel_radius: 0.075      # m, D 150 mm halved
  drive_wheel_width: 0.030       # m, B
  wheel_separation: 0.529        # m, W4 track width of the drive wheels
  drive_wheel_mass: 1.2          # kg
  caster_wheel_radius: 0.0500    # m
  caster_wheel_width: 0.030      # m
  caster_inset_x: 0.198          # m, L3 396 mm castor wheel base, halved
  caster_inset_y: 0.158          # m, W3 316 mm castor track, halved
  caster_swivel_offset: 0.030    # m
  caster_wheel_mass: 0.5         # kg
  caster_swivel_mass: 0.3        # kg

  # ---- Masses and payload --------------------------------------------
  tare_mass: 70.0                # kg
  max_payload: 100.0             # kg, standard version
  max_incline: 5.0               # deg

  # ---- Motion ---------------------------------------------------------
  max_linear_speed: 1.5          # m/s
  max_linear_accel: 2.4          # m/s^2
  max_linear_accel_unladen: 2.4  # m/s^2
  max_reverse_speed: 0.30        # m/s
  max_angular_speed: 1.5         # rad/s
  emergency_decel: 1.50          # m/s^2
  brake_actuation_delay: 0.05    # s
  control_latency: 0.10          # s, sensor to command; NOT YET MEASURED

  # ---- Battery, from section 1.3.4.1 ----------------------------------
  battery_capacity_ah: 50.0      # Ah
  battery_nominal_voltage: 24.0  # V
  battery_capacity_kwh: 1.20     # kWh
  battery_cycles: 3000
  battery_mass: 18.0             # kg

  # ---- Safety scanners: SICK nanoScan3, diagonally opposite corners ----
  # NOT the manual's LS1 and LS2 positions; see the header. Optical centre
  # flush at the envelope corner and 5 mm proud of it, as on the MiR250 build,
  # because a scanner recessed inboard cannot see tangentially along the
  # vehicle's own sides.
  scanner_mount_x: 0.300         # m, from robot centre
  scanner_mount_y: 0.2845        # m
  scanner_mount_height: 0.110    # m above ground, scan plane
  scanner_body_x: 0.107          # m
  scanner_body_y: 0.080          # m
  scanner_body_z: 0.080          # m
  scanner_housing_inset: 0.060   # m, housing drawn inboard of the optics
  scanner_mass: 0.7              # kg
  scanner_scan_angle: 275.0      # deg
  scanner_angular_resolution: 0.17   # deg
  scanner_samples: 1618          # rays across the aperture
  scanner_update_rate: 14.28     # Hz, rounded DOWN from 1/70 ms; see provenance
  scanner_response_time: 0.070   # s
  scanner_measuring_range: 40.0  # m
  scanner_protective_range: 3.0  # m
  scanner_warning_range: 10.0    # m
  scanner_protective_supplement: 0.065   # m
  scanner_detection_resolution: 0.070    # m
  self_filter_margin: 0.060      # m

  # ---- Cameras: Intel RealSense D435i ---------------------------------
  camera_mount_height: 0.270     # m
  camera_mount_y: 0.150          # m
  camera_splay: 13.5             # deg
  camera_hfov: 87.0              # deg
  camera_vfov: 58.0              # deg
  camera_min_depth: 0.105        # m
  camera_max_range: 10.0         # m
  camera_body_x: 0.025           # m
  camera_body_y: 0.090           # m
  camera_body_z: 0.025           # m
  camera_mass: 0.072             # kg
  camera_update_rate: 15.0       # Hz
  camera_fov_height: 1.800       # m, at the distance below
  camera_fov_distance: 1.200     # m
  camera_min_ground_view: 0.250  # m

  # ---- Miscellaneous --------------------------------------------------
  imu_mass: 0.02                 # kg
  beacon_mass: 0.15              # kg

# Published figures the model is validated AGAINST rather than tuned to.
#
# EXCEPT THE FOUR CORRIDOR AND DOORWAY FIGURES, WHICH ARE NOT PUBLISHED.
#
# The MiR250 sheet quotes operational corridor and doorway widths. The MP-400
# manual quotes none: it is an operating manual and gives dimensions, ratings
# and sensor positions, not application envelopes. The figures previously here
# (1.100, 0.900, 0.850, 0.900) appear in no source and are the reason
# test_robot_fits_the_corridor_it_claims failed, since a 0.850 m target sits
# OUTSIDE a body diagonal of 0.813 m and so could never have been a claim about
# this vehicle.
#
# They are now DERIVED, and the derivation is the one thing the two platforms
# share: the same scanners, the same protective field supplement and the same
# safety configuration, so the clearance the safety configuration demands
# around the body is the same and only the body changes. Taking that clearance
# from the MiR250's published figures and applying it to this chassis:
#
#   default   1.350 - 0.580 = 0.770 over the width -> 0.559 + 0.770 = 1.329
#   dynamic   1.000 - 0.580 = 0.420 over the width -> 0.559 + 0.420 = 0.979
#   doorway   1.300 - 0.580 = 0.720 over the width -> 0.559 + 0.720 = 1.279
#   90 turn   0.950 - 0.988 = -0.038 on the diagonal -> 0.813 - 0.038 = 0.775
#
# These are ESTIMATES OF A TARGET, which is a weaker thing than the MiR250 row
# of this block holds, and they must not be quoted as manufacturer figures.
# corridor_width_dynamic in particular is read by generate_fields.py to size a
# protective field, so it is load bearing and is flagged in docs/validation.md.
validation_targets:
  corridor_width_default: 1.329      # m, derived; not published
  corridor_width_dynamic: 0.979      # m, derived; not published
  corridor_width_90_turn: 0.775      # m, derived; not published
  doorway_width_default: 1.279       # m, derived; not published
  distance_to_max_speed: 0.47        # m, v^2 / 2a at 1.5 m/s and 2.4 m/s2
  runtime_unloaded_h: 9.0            # h
  runtime_loaded_h: 5.0              # h
  runtime_standby_h: 20.0            # h
  min_object_at_1m: 0.070            # m
  min_object_at_2p5m: 0.150          # m
  camera_combined_hfov: 114.0        # deg

safety_reference:
  standard: "EN ISO 3691-4"
  performance_level: "PL d, Category 3"
  scanner_type: "IEC 61496-1/-3 Type 3"
  note: >
    Identical to the MiR250 build and for the same reason. The protective
    function rests on the SICK nanoScan3, a rated device with a published
    response time. The MP-400's own laser scanners are quoted in its manual at
    0.5 degree resolution over plus or minus 135 degrees with no safety rating,
    no response time and no protective field capability, so they are a
    navigation sensor and not a safety one. Changing the vehicle must not
    silently change what the safety argument rests on. Their MOUNTING
    POSITIONS in manual section 1.3.3 are not used either, for the same
    reason: they describe where that other sensor sits, not where this one
    does. See the header of this file.

provenance:
  # ---- From the MP-400 Operating Instructions, section 1.3.1 ----------
  chassis_length:      {kind: datasheet, src: "MP-400 manual 1.3.1, L1 overall length of platform 590 mm"}
  chassis_width:       {kind: datasheet, src: "MP-400 manual 1.3.1, W1 maximum width 559 mm"}
  chassis_height:      {kind: datasheet, src: "MP-400 manual 1.3.1, H1 height of mounting profiles 411 mm. H2, the top plate, is 381 mm; H1 is used because it is the tallest fixed structure and therefore what an overhead obstruction has to clear"}
  ground_clearance:    {kind: datasheet, src: "MP-400 manual 1.3.1, G 44 mm"}
  drive_wheel_radius:  {kind: derived,   src: "MP-400 manual 1.3.1, D diameter of drive wheels 150 mm, halved"}
  drive_wheel_width:   {kind: datasheet, src: "MP-400 manual 1.3.1, B width of drive wheels 30 mm"}
  wheel_separation:    {kind: datasheet, src: "MP-400 manual 1.3.1, W4 track width of the drive wheels 529 mm. This is the figure the differential drive kinematics need and the MiR250 sheet never published it, so on that platform it is an estimate"}
  caster_inset_x:      {kind: derived,   src: "MP-400 manual 1.3.1, L3 wheel base of the castor wheels 396 mm, halved"}
  caster_inset_y:      {kind: derived,   src: "MP-400 manual 1.3.1, W3 track width of the castor wheels 316 mm, halved"}

  # ---- Section 1.3.2 Absolute Maximum Ratings ------------------------
  max_linear_speed:    {kind: datasheet, src: "MP-400 manual 1.3.2, Maximum speed 1.5 m/s"}
  max_linear_accel:    {kind: datasheet, src: "MP-400 manual 1.3.2, Maximum acceleration 2.4 m/s2. Note this manual states ONE acceleration rating and does not distinguish laden from unladen, unlike the MiR250 sheet whose 0.3 m/s2 is explicitly a with-maximum-payload figure. So there is no separate unladen value to carry here"}
  max_linear_accel_unladen: {kind: datasheet, src: "MP-400 manual 1.3.2, Maximum acceleration 2.4 m/s2. Set equal to the laden figure because the manual publishes a single rating. Carried as its own key so the mission layer's laden and unladen switching works unchanged across platforms, which is the point of the abstraction"}
  max_payload:         {kind: datasheet, src: "MP-400 manual 1.3.2, Payload on top plate standard version 100 kg. A 150 kg high payload version exists and is a different variant"}
  tare_mass:           {kind: datasheet, src: "MP-400 manual 1.3.4.3, Weight 70 kg"}

  # ---- Section 1.3.4.1 Electrical -------------------------------------
  battery_capacity_ah: {kind: datasheet, src: "MP-400 manual 1.3.4.1, Battery capacity 50 Ah"}
  battery_nominal_voltage: {kind: datasheet, src: "MP-400 manual 1.3.4.1, Rated battery voltage 24 V"}
  battery_capacity_kwh: {kind: derived,   src: "50 Ah at 24 V nominal = 1.20 kWh"}

  # ---- Scanner mounting: NOT from section 1.3.3; see the header --------
  scanner_mount_x:     {kind: estimated, src: "not published FOR THIS SENSOR. The manual's 1.3.3 gives LS1 at X 230 mm and LS2 at X -354 mm, but those locate the MP-400's own unrated scanners, which this build does not fit, so they are not a source for where a nanoScan3 goes. Taken instead at the corner, 0.295 m of half length plus the 5 mm proud the MiR250 build mounts at, = 0.300 m, because a scanner inboard of the corner cannot see tangentially along the vehicle's own sides"}
  scanner_mount_y:     {kind: estimated, src: "not published FOR THIS SENSOR. The manual's 1.3.3 puts LS1 and LS2 on the centre line at Y 0, which is the arrangement for the MP-400's own scanners and not for this pair; a centre-line pair is occluded fore and aft by the vehicle's own body and the description, the self filter and the field generator are all built for a corner pair. Taken at 0.2795 m of half width plus 5 mm proud, = 0.2845 m, matching the mounting practice on the MiR250 build"}
  scanner_mount_height: {kind: estimated, src: "not published FOR THIS SENSOR. 110 mm is taken from the manual's 1.3.3 Z-pos for the MP-400's own scanners, which is a real measurement of where a scan plane fits on this chassis even though the sensor there is a different one. It clears the 44 mm ground clearance, keeps the 80 mm tall nanoScan3 body well under the 411 mm deck, and puts the plane low enough to see a foot"}

  # ---- Estimated platform figures, not published -----------------------
  vehicle_envelope_height: {kind: estimated, src: "NOT published. The manual gives the platform height as 411 mm to the mounting profiles but says nothing about what is carried on them. 1.000 m is a smaller allowance than the MiR250's 1.200 m because this is a 100 kg class platform carrying correspondingly smaller loads. It sets the camera obstacle layer's marking band"}
  corner_cut_x:        {kind: estimated, src: "not published as a dimension; the chamfered corners are visible in the manual's Fig. 2 and Fig. 5 but no figure is given"}
  corner_cut_y:        {kind: estimated, src: "not published as a dimension. Set equal to corner_cut_x because the chamfers in the manual Fig. 2 and Fig. 5 appear symmetric about both axes, which is the usual construction for a platform of this shape"}
  caster_wheel_radius: {kind: estimated, src: "not published; scaled from the castor visible in Fig. 5 against the known 150 mm drive wheel"}
  caster_wheel_width:  {kind: estimated, src: "not published; proportionate to the castor above"}
  caster_swivel_offset: {kind: estimated, src: "not published; a typical trail for a castor of this size"}
  drive_wheel_mass:    {kind: estimated, src: "not published; a 150 by 30 mm driven wheel with its hub"}
  caster_wheel_mass:   {kind: estimated, src: "not published; a 50 mm swivel castor wheel with its bearing, taken at the heavier end so the rotational inertia of the undriven wheels is not flattered"}
  caster_swivel_mass:  {kind: estimated, src: "not published; the swivel fork and its bearing for the castor above, taken at the heavier end for the same reason as the wheel, so the yaw inertia of the undriven corners is not flattered"}
  battery_mass:        {kind: estimated, src: "not published; a 24 V 50 Ah lead acid or LiFePO4 pack, taken at the heavier end so the inertia is not flattered"}
  battery_cycles:      {kind: estimated, src: "not published in this manual; carried at the same figure as the MiR250 build so runtime and ageing models stay comparable between platforms"}
  max_incline:         {kind: estimated, src: "NOT published in this manual. 5 degrees is conservative for an indoor platform with 44 mm of ground clearance, which is low and is the binding constraint rather than traction"}
  max_angular_speed:   {kind: estimated, src: "not published; carried at the MiR250 figure so the two platforms are compared on the same rotational envelope. The MP-400's smaller circumscribed radius means the same rate sweeps its corners more slowly, so this is the conservative direction"}
  max_reverse_speed:   {kind: estimated, src: "NOT published. Held at the MiR250 figure and for the same reason: the cameras face forward, so a reversing vehicle detects on the scan plane alone"}
  emergency_decel:     {kind: estimated, src: "NOT published. Held at 1.50 m/s2, the same conservative indoor braking rate used for the MiR250, so protective field sizes between the two platforms differ only because of geometry and speed rather than because of an assumption. It remains the least supported number in the safety calculation on either platform"}
  brake_actuation_delay: {kind: estimated, src: "not published; the manual gives a static brake torque of 1.47 Nm but no engagement time"}
  control_latency:     {kind: estimated, src: "NOT YET MEASURED, exactly as on the MiR250. It feeds protective field size directly and measuring it end to end on the running system is an outstanding item in docs/validation.md"}
  imu_mass:            {kind: estimated, src: "not published; a small MEMS IMU board"}
  beacon_mass:         {kind: estimated, src: "not published; a small LED signal beacon"}

  # ---- Sensor suite, identical parts to the MiR250 build ---------------
  scanner_body_x:      {kind: datasheet, src: "SICK nanoScan3 sheet, Dimensions W x H x D"}
  scanner_body_y:      {kind: datasheet, src: "SICK nanoScan3 sheet, Dimensions W x H x D, height 80 mm"}
  scanner_body_z:      {kind: datasheet, src: "SICK nanoScan3 sheet, Dimensions W x H x D"}
  scanner_housing_inset: {kind: estimated, src: "not published; the housing is drawn inboard of the optical centre so the body sits in the corner recess while the optics stay flush, which is how a corner-mounted safety scanner is packaged. The 60 mm chamfer of this chassis, corner_cut_x and corner_cut_y, is what the housing sits in"}
  scanner_mass:        {kind: datasheet, src: "SICK nanoScan3 sheet, Weight 0.67 kg, carried at 0.7 kg as on the MiR250 build"}
  scanner_scan_angle:  {kind: datasheet, src: "SICK nanoScan3 sheet, Scanning angle 275 deg"}
  scanner_angular_resolution: {kind: datasheet, src: "SICK nanoScan3 sheet, Angular resolution 0.17 deg"}
  scanner_samples:     {kind: derived,   src: "275 deg / 0.17 deg = 1617.6, rounded up to 1618"}
  scanner_update_rate: {kind: derived,   src: "1 / 70 ms response time = 14.2857 Hz, rounded DOWN to 14.28. Rounding a protective device UP claims it reports faster than it responds, which flatters every stopping distance computed from it, so the direction of the rounding is deliberate"}
  scanner_response_time: {kind: datasheet, src: "SICK nanoScan3 sheet, Response time 70 ms"}
  scanner_measuring_range: {kind: datasheet, src: "SICK nanoScan3 sheet, Distance measuring range 40 m"}
  scanner_protective_range: {kind: datasheet, src: "SICK nanoScan3 sheet, Protective field range 3 m"}
  scanner_warning_range: {kind: datasheet, src: "SICK nanoScan3 sheet, Warning field range 10 m"}
  scanner_protective_supplement: {kind: datasheet, src: "SICK nanoScan3 sheet, Protective field supplement 65 mm"}
  scanner_detection_resolution: {kind: datasheet, src: "SICK nanoScan3 sheet, Resolution can be configured, 70 mm setting chosen rather than the 20 mm used on the MiR250 build. This is the one sensor SETTING that differs between the platforms and it is a deliberate coarsening: min_object_at_1m below is the target it sets"}
  self_filter_margin:  {kind: measured,  src: "MEASURED on the MiR250 build at 40 mm of self observation beyond the chassis half length, and carried here at 0.060 m pending its own measurement on this platform. The pods are mounted the same way on the same corner geometry, so the derivation transfers, but the chassis is smaller and the figure has not been observed on this vehicle. Flagged in docs/validation.md"}
  camera_mount_height: {kind: estimated, src: "not published for this platform; below the 411 mm profile height"}
  camera_mount_y:      {kind: estimated, src: "not published; a forward facing pair splayed about the centre line"}
  camera_splay:        {kind: estimated, src: "not published; chosen so the two 87 deg fields overlap slightly"}
  camera_hfov:         {kind: datasheet, src: "Intel RealSense D435i sheet, Depth Field of View 87 deg +/- 3 deg horizontal"}
  camera_vfov:         {kind: datasheet, src: "Intel RealSense D435i sheet, Depth Field of View vertical"}
  camera_min_depth:    {kind: datasheet, src: "Intel RealSense D435i sheet, Minimum Depth Distance Min-Z 0.105 m"}
  camera_max_range:    {kind: datasheet, src: "Intel RealSense D435i sheet, ideal range"}
  camera_body_x:       {kind: datasheet, src: "Intel RealSense D435i sheet, Length x Depth x Height"}
  camera_body_y:       {kind: datasheet, src: "Intel RealSense D435i sheet, length 90 mm"}
  camera_body_z:       {kind: datasheet, src: "Intel RealSense D435i sheet, height 25 mm"}
  camera_mass:         {kind: estimated, src: "NOT published in the Intel sheet, which gives no mass. 72 g is a weighed figure widely reported for the D435i and is labelled estimated because it is not from the sheet"}
  camera_update_rate:  {kind: tuned,     src: "15 Hz is a CPU BUDGET decision and not a sensor limit; the D435i will run far faster. Two depth streams at full rate starved the MPPI control loop from 20 Hz to between 8 and 19 Hz on the reference machine. See docs/adr/0003-three-tier-simulation.md"}
  camera_fov_height:   {kind: estimated, src: "not published for this platform; carried from the MiR250 build since the camera is the same part"}
  camera_fov_distance: {kind: estimated, src: "not published for this platform. Carried from the MiR250 build because the camera is the same part and the pairing of a 1.8 m field height at 1.2 m distance is a property of the lens, not of the vehicle it is bolted to"}
  camera_min_ground_view: {kind: estimated, src: "not published. It is a MOUNTING GEOMETRY figure rather than a sensor limit: how far ahead the floor first enters view follows from the camera height and its downward tilt, so it must be recomputed if either changes on this platform, whose deck is 411 mm rather than the MiR250 300 mm"}
