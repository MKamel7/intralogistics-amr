# Online SLAM on the MERGED 360 degree scan.
#
# The merged scan is the right input rather than either raw scanner: a single
# 275 degree scanner mounted in a corner sees less than half the surroundings,
# and loop closure on a partial view is far weaker. The merge already handles
# the motion compensation between the two sensors, which matters here because
# scan matching is exactly where an uncompensated 70 mm smear would show up.
#
# Resolution is 5 cm. The platform's own published minimum detectable object is
# 20 mm at 1 m, so a finer grid would claim detail the sensor does not carry,
# and a coarser one would lose the rack uprights that make an aisle recognisable.

# Keyed with the /** wildcard rather than the node name.
#
# Keyed as `slam_toolbox:` the file silently did not apply: `ros2 param get
# /slam_toolbox scan_topic` returned "Parameter not set", the node came up on
# its own defaults and published no map and no map->odom, with nothing logged.
# A wildcard key cannot miss.
/**:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    resolution: 0.05
    max_laser_range: 20.0
    minimum_time_interval: 0.2
    transform_publish_period: 0.02
    # STAMP map->odom SLIGHTLY IN THE FUTURE, which is what this parameter is
    # for and why the transform tolerances alone did not fix the race.
    #
    # The controller asks to transform the goal at "now". slam_toolbox had just
    # published map->odom stamped a few milliseconds earlier, so the request was
    # in the future relative to the newest data and tf2 refused it:
    #
    #   Lookup would require extrapolation into the future. Requested time
    #   326.928000 but the latest data is at time 326.912000
    #   Unable to transform goal pose into costmap frame
    #
    # and the controller aborted the whole goal rather than waiting one cycle.
    # Raising the consumers' tolerance did not help, because a tolerance governs
    # how far into the PAST a lookup may reach, not the future.
    #
    # Publishing the transform valid 0.2 s ahead closes the gap at the source.
    # This is standard practice with slam_toolbox and it is honest: map->odom is
    # a slowly varying correction, so asserting it holds for another 200 ms is a
    # far smaller approximation than dropping a navigation goal over 16 ms.
    transform_timeout: 0.2
    # RESTAMP THE PUBLISHED TRANSFORM to the current time. VERIFIED: goal
    # transform failures went from 6 to 0 and completed cycles from 2 of 5 to
    # 4 of 5 across a five cycle run.
    #
    # Default is false, which stamps map -> odom from the SCAN time. Measured
    # over 599 publications, the resulting stamp sits ahead of "now" by anywhere
    # between 40 ms and 28 SECONDS, mean 3.4 s. That spread is not normal and
    # the low end coincides with the 36 ms future-dated lookups that abort
    # controller goals.
    #
    # Setting this true makes the stamp track the clock instead of the scan,
    # and it closed the fault outright. Two earlier explanations for the same
    # failure, a growing SLAM pose graph and the mission's own goal stamping,
    # were each tested and refuted first; see V-21 and ADR 0010.
    restamp_tf: true
    map_update_interval: 1.0

    # Scan matching. This is what stops the pose drifting down a featureless
    # aisle, which is the failure mode the localisation benchmark is built
    # around, so it is on and it is tuned rather than left at defaults.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 10.0

    # Loop closure.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
