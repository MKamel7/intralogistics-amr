# GENERATED by amr_navigation/tools/generate_nav2.py from
# amr_description/config/platforms/mp400_class.yaml and
# config/nav2.yaml.in. Do not hand-edit: change the spec or the
# template and regenerate. A test asserts this file matches.
#
# Derived for this platform:
#   platform mp400_class, chassis 590 x 559 mm
#   footprint 600 x 569 mm, the scanner optical centres, which stand proud of the chassis
#   circumscribed radius 0.4134 m, inscribed 0.2845 m
#   inflation radius 0.4134 + 0.05 clearance = 0.4634 m
#   commissioned speed 0.50 x 1.50 m/s rated = 0.75 m/s
#   ordinary envelope, both directions, min(2.40 unladen rating, 0.667 x 1.50 emergency) = 1.00 m/s2
#   local costmap 2 x 0.75 m/s x 2.80 s horizon = 4.20 m, rounded up to 5 m square
#   voxel layer 1.00 m envelope / 0.10 m = 10 voxels

# Navigation for the intralogistics AMR, mp400_class.
#
# WHERE THIS SITS. SLAM builds the map, this plans and follows a path on it, and
# the collision monitor sits AFTER everything here and before the wheels. That
# order is the whole safety argument: nothing in this file can command the
# vehicle into a person, because the last thing to touch the command is the
# monitor, which is configured from the stopping-distance calculation and does
# not consult a plan. Navigation is allowed to be clever. It is not allowed to
# be trusted.
#
# EVERY LIMIT THAT DEPENDS ON THE VEHICLE TRACES TO
# config/platforms/mp400_class.yaml, through the generator. Where a number is
# lower than the platform allows, the reason is stated.
#
# Limits that do NOT depend on the vehicle are literals here, and that is
# deliberate. Critic weights, server timeouts, plugin choices and the ranges of
# sensors both platforms share are not functions of the chassis, and deriving
# them from it would be numerology dressed as provenance.
#
# MEASUREMENTS QUOTED BELOW WERE TAKEN ON THE MiR250 BUILD unless they say
# otherwise, and are labelled where they appear. They are kept because the
# failure each one describes is a property of the software, not of that
# chassis. The arithmetic that IS chassis-specific is generated, so it is
# correct for whichever platform this file was produced for.

amcl:
  ros__parameters:
    # Present but NOT USED while SLAM is running: slam_toolbox owns map -> odom
    # and two publishers of one transform is a fight nobody wins. This is here
    # for the localisation-on-a-saved-map mode, which is what a deployed vehicle
    # actually runs once the building has been surveyed.
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    max_particles: 2000
    min_particles: 500
    laser_max_range: 25.0        # nanoScan3 sheet, protective range class
    update_min_d: 0.20
    update_min_a: 0.20
    transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_drive_controller/odom
    bt_loop_duration: 10
    # 30 s, up from 20. The mission fires the next cycle as soon as the
    # previous one reports, and controller_server may still be unwinding the
    # last goal's recovery. It then fails to acknowledge the new goal in time
    # and the cycle dies after 9 seconds without the vehicle moving. Measured
    # twice, at 8 s and 9 s, with the identical signature both times.
    # HOW LONG A BEHAVIOUR TREE NODE WAITS FOR A SERVER TO ACCEPT A GOAL.
    #
    # 30 ms was the value here and it is the direct cause of two cycles in
    # three failing. The behaviour tree asks controller_server to accept a
    # follow_path goal and gives it 30 ms to answer. MPPI runs 2000 samples
    # over 56 steps with consider_footprint on a single threaded executor, and
    # its worst iteration was measured at 152 ms in one run and 380 ms in
    # another. A handshake that lands inside one of those cannot be answered,
    # so the node times out and the goal aborts:
    #
    #   Timed out while waiting for action server to acknowledge goal request
    #   for follow_path
    #
    # Every failed cycle in V-35 maps to one of those lines, and there were no
    # planner failures at all.
    #
    # THE TIMEOUT EXISTS TO DETECT A DEAD SERVER, NOT A BUSY ONE. A controller
    # that is mid solve is working. 1000 ms is Nav2's own convention for
    # waiting on a service and clears the worst measured iteration by a factor
    # of 2.6, so a genuinely dead server is still caught quickly while a slow
    # one is not shot for it.
    #
    # This does NOT excuse the control loop missing its rate. That is a real
    # cost problem, it degrades path quality, and it is tracked separately.
    default_server_timeout: 1000
    # The stock trees. A bespoke tree is a thing to write when there is a
    # bespoke behaviour to put in it, and right now there is not; writing one
    # early only guarantees it drifts out of step with the upstream nodes.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    # The chain into the wheels is stamped end to end, because
    # diff_drive_controller 4.x rejects an unstamped Twist. Getting this wrong
    # is silent: the controller publishes happily and the wheels never turn.
    enable_stamped_cmd_vel: true

    # Below these the vehicle is treated as stopped. Set from the drive's own
    # deadband rather than zero, because an exactly-zero test never fires.
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.50     # holonomic axis; this vehicle has none
    min_theta_velocity_threshold: 0.05

    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # PoseProgressChecker, NOT SimpleProgressChecker, and the difference
      # decides whether the vehicle can dock at a station at all.
      #
      # SimpleProgressChecker counts LINEAR movement only. A station has a side
      # you load from, so arriving means reaching a position AND turning to face
      # it. During that final turn the vehicle is doing exactly the right thing
      # and moving zero distance, so after the allowance expires it is declared
      # stuck and the behaviour tree starts recovering from a fault that does
      # not exist. Measured: the vehicle reached a point 0.57 m from the station,
      # turned to the approach heading, and was failed for "Failed to make
      # progress" eleven times, so no transport cycle ever completed.
      #
      # PoseProgressChecker counts rotation as progress too, which is the only
      # reading of "progress" that makes sense for a vehicle that must arrive
      # facing a particular way.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.5
      # Generous, deliberately. The vehicle is expected to stand still while a
      # pedestrian crosses in front of it, and a tighter window would call that
      # normal, correct behaviour a navigation failure and start recovering.
      # 25 s. The vehicle legitimately spends a long time on a slow, careful
      # manoeuvre in a narrow aisle, and calling that a failure starts a
      # recovery that costs far more time than the manoeuvre would have.
      movement_time_allowance: 25.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      # 0.25 rad, about 14 degrees. A loading station has a side you approach
      # from, not a millimetre-accurate dock, and squeezing the last few degrees
      # out of a differential drive beside a wall costs far more time than the
      # precision is worth. A docking manoeuvre that genuinely needs better than
      # this belongs in a docking behaviour, not in the goal checker.
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      # MPPI over DWB or Pure Pursuit.
      #
      # This vehicle's whole problem is moving people. MPPI rolls out a few
      # thousand candidate trajectories per cycle against the CURRENT costmap
      # and averages them by cost, so a pedestrian who has just walked into the
      # local costmap changes the commanded motion on the next cycle rather than
      # at the next replan. Pure Pursuit follows the path geometrically and
      # would need the planner to notice; DWB samples a much thinner set of
      # constant-curvature arcs and tends to commit.
      #
      # The cost is CPU, and that is a real cost. It is affordable here because
      # a warehouse AMR carries a compute module, not a microcontroller.
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05                 # matches the 20 Hz controller period
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # 0.75 m/s, NOT the platform's rated 1.50 m/s.
      #
      # The rated maximum is a straight-line specification for clear aisles.
      # The protective field sized for the rated speed reaches far enough that
      # the vehicle would stop for a pedestrian two aisles away and never
      # finish a job. Speed is limited here and the field sized to match, which
      # is the same trade a real installation makes when it commissions a site.
      # The commissioned fraction is 0.50 of rated and is applied identically
      # on both platforms; see generate_nav2.py.
      vx_max: 0.75
      vx_min: -0.30                  # reversing out of a dead end only
      vy_max: 0.0                    # differential drive
      wz_max: 1.50                   # platform maximum angular speed
      # THE ORDINARY ENVELOPE, SYMMETRIC, and on this platform it is
      # min(2.40 unladen rating, two thirds of 1.50 emergency) = 1.00 m/s2 in
      # BOTH directions.
      #
      # Two separate reasons cap this and they pull on different limits.
      #
      # BRAKING is capped so the emergency rate stays a reserve. The MP-400's
      # unladen acceleration rating is HIGHER than its emergency deceleration,
      # so taken literally the controller would brake harder in normal driving
      # than the protective fields assume it can in an emergency, and every
      # stopping distance behind those fields would be computed from a rate the
      # vehicle beats.
      #
      # ACCELERATION is capped to the same figure so the envelope is symmetric.
      # A vehicle that can accelerate harder than it can brake cannot converge
      # on a goal, because every trajectory MPPI samples towards the goal
      # overshoots it. Measured on the MP-400 when this was not done, with
      # tools/track_goal.py: it came within 0.02 m of a station at 0.7 m/s, did
      # not stop, and orbited it until the leg timed out, commanding motion in
      # 188 of 200 samples. It was invisible on the MiR250, where the two
      # figures happen to be equal anyway.
      #
      # The UNLADEN rating is the input rather than the laden one. On the MiR250
      # build the sheet's 0.3 m/s2 laden figure is a load-retention limit, and
      # using it did not merely make the vehicle gentle, it stopped MPPI
      # working: every sampled trajectory landed within 0.015 m/s of the last
      # command, so the candidate set had no diversity and the optimiser
      # returned essentially its prior. Measured on that build with a valid
      # 167-pose plan in hand: 0.014 m/s commanded, 0.32 m in three minutes.
      ax_max: 1.00
      ax_min: -1.00
      az_max: 2.00                   # no angular acceleration is published
                                     # in either platform spec, so this is a
                                     # literal rather than a false derivation
      iteration_count: 1
      prune_distance: 1.7
      # Matched to the costmaps' 0.5 s. A controller that tolerates less than
      # the costmap it plans against will fail first, and fail less clearly.
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true                # publishes candidate trajectories; this is
                                     # the single most useful thing to show when
                                     # explaining why the vehicle did what it did
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0           # unused on a differential drive
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        # Reversing is allowed but discouraged. The scanners cover 360 degrees
        # between them, but the cameras face forward, so a reversing vehicle is
        # navigating on 2D scan alone. Cheaper to turn round.
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # The vehicle is 590 by 559 mm and NOT round. A circular approximation
        # either forbids legal gaps or permits corner clips, and the 90 degree
        # corner this platform claims is 775 mm.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        # 10.0, down from the stock 14.0, and PathFollow raised to match.
        #
        # These two critics pull against each other. PathAlign penalises being
        # off the path; PathFollow rewards advancing along it. In open space the
        # stock balance is right. In an aisle at this building's measured
        # median corridor width of 1.34 m, where the vehicle is 569 mm wide and
        # every manoeuvre displaces it from the line, a strong align term makes
        # it fight to stay exactly on the path instead of getting on with the
        # journey. The 1.34 m is MEASURED, see V-22; an earlier version
        # of this note said 1.35 m, which was the MiR250 datasheet's corridor
        # figure repeated as though it described this warehouse.
        #
        # Measured on the MiR250 build: the delivery leg took
        # 127 s for 8.1 m with two "Failed to make progress" timeouts and the
        # recoveries they trigger, while the controller loop was healthy, the
        # safety layer cost 1 second, and nothing was in the way. The vehicle
        # covered 19.1 m on a 13.8 m round trip, 38 percent excess.
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        # 12.0, up from the stock 5.0. See the note on PathAlignCritic: in
        # confined aisles the controller needs a stronger reason to make
        # forward progress than to sit precisely on the line.
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # THE PLANNER IS SUBSTITUTED, and the reasoning below survives the
    # substitution because it is about the choice, not about one plugin's
    # parameters.
    #
    # SmacPlanner2D IS THE DEFAULT, AND HYBRID-A* IS NOT A CANDIDATE.
    #
    # Hybrid-A* is the more impressive sounding choice and it is the wrong one
    # here. It plans in x, y, heading under a minimum turning radius, which is
    # what an Ackermann vehicle needs. This is a differential drive: it turns
    # on the spot. Imposing a turning radius it does not have would forbid
    # legal manoeuvres, most obviously the spot turn the corner requirement
    # depends on, and would produce longer paths to no benefit. It is excluded
    # from the comparison table for the same reason: a table where the
    # project's own planner beats a strawman is worth less than no table.
    #
    # This changes the day a towed cart or a trailer is added, because then
    # the combination really does have a minimum radius. Recorded in the ADR.
    #
    # THE VEHICLE PLANS ONLY ON FLOOR IT HAS SURVEYED, and every candidate
    # below sets allow_unknown: false. This was tried both ways and the
    # evidence is worth keeping, because each setting fails in a way that
    # looks like something else.
    #
    # With unknown floor allowed, the planner routes into space it knows
    # nothing about. That works until the gap it chose turns out to be
    # narrower than the vehicle, and by the time the scan reveals the walls
    # the vehicle is already inside. Measured: it drove itself to a spot with
    # 0.400 m of clearance against an inscribed radius of 0.501 m, where every
    # candidate trajectory is in collision, so the controller correctly
    # commanded zero and it sat there for four consecutive survey rounds while
    # the planner cheerfully produced a fresh path every second.
    #
    # With unknown floor forbidden it appeared to fail worse, refusing every
    # goal. That turned out not to be this setting's fault at all: the survey
    # tool was offering goals reachable only through gaps the vehicle does not
    # fit through, because its reachability search walked free cells rather
    # than cells with the vehicle's clearance. With that fixed, the goals
    # offered are ones the planner can genuinely reach.
    #
    # So: false. A vehicle that shares a floor with people should not drive
    # into a space on the assumption that it is empty, and the survey grows
    # the map perfectly well by driving to the edge of what it already knows.
    GridBased:
      # A* on the costmap with a cost aware travel multiplier
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    enable_stamped_cmd_vel: true
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    # Recoveries drive blind by design, so they are held well under the speed
    # at which the protective field is sized. The monitor still backs them up.
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # The same limits MPPI is given, so the smoother cannot quietly permit
    # something the controller was forbidden or clip something it was allowed.
    max_velocity: [0.75, 0.0, 1.50]
    min_velocity: [-0.30, 0.0, -1.50]
    max_accel: [1.00, 0.0, 2.00]   # unladen; see ax_max above
    max_decel: [-1.00, 0.0, -2.00]   # capped below the emergency rate
    odom_topic: /diff_drive_controller/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      # A pause at each waypoint. During a survey run this lets the scan
      # settle before the vehicle moves on, which visibly tightens the map at
      # the far end of an aisle.
      waypoint_pause_duration: 1500

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      # TF TOLERANCE, and it is what stood between one completed cycle and
      # three. The controller transforms the goal into the costmap frame using
      # THIS tolerance, not the controller's own. Left at the default it aborted
      # goals outright on a 16 millisecond miss:
      #
      #   Lookup would require extrapolation into the future. Requested time
      #   326.928000 but the latest data is at time 326.912000, map to odom
      #   Unable to transform goal pose into costmap frame
      #
      # slam_toolbox already republishes map to odom at 50 Hz, so this is
      # ordinary scheduling jitter between a request for "now" and the last
      # transform to land, not a stale transform. The tolerance makes the lookup
      # wait those few milliseconds instead of failing the whole goal. The
      # failure signature was unmistakable once seen: always about 8 seconds,
      # always the same leg, never with anything in the way.
      transform_tolerance: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05                 # matches the SLAM map; resampling a
                                       # costmap off its map is free error
      track_unknown_space: true
      # THE REAL FOOTPRINT, not a radius.
      #
      # 600 by 569 mm: the 590 by 559 mm chassis plus the scanner pods, whose
      # optical centres stand 5.0 mm proud at diagonally opposite corners.
      #
      # A circular robot of the circumscribed radius 0.4134 m would refuse the
      # 775 mm corner this platform claims; one of the inscribed radius
      # 0.2845 m would cut it.
      footprint: "[[0.3000, 0.2845], [0.3000, -0.2845], [-0.3000, -0.2845], [-0.3000, 0.2845]]"
      # ZERO PADDING, and the argument for it is the argument that was first
      # made against raising it.
      #
      # Nav2 treats a cell as blocked once it is within the INSCRIBED radius of
      # an obstacle, which for this footprint is 0.2845 m. Padding adds to that
      # radius, so it is a HARD CONSTRAINT, and the following was measured on
      # the MiR250 build by moving it in both directions.
      #
      # Too little: with 0.02 m the planner threaded a gap that cleared the
      # vehicle by 9 mm, which survives neither map noise nor localisation
      # drift. It followed that path into a pocket with 0.450 m of true
      # clearance, below its own inscribed radius, where every candidate
      # trajectory is in collision and it cannot move in any direction.
      #
      # Too much: 0.08 m took the effective inscribed radius to 0.613 m, and
      # this warehouse has real, drivable positions with 0.550 m of clearance.
      # The vehicle drove to one of them perfectly well and the planner then
      # declared its own position blocked, which is a worse failure than the one
      # the padding was meant to cure.
      #
      # So padding cannot express "prefer roomy routes", and the MISSION layer
      # carries that preference instead: the survey only ever targets floor with
      # 0.70 m of clearance and only routes itself through such floor. If the
      # mission layer carries the margin, the planner should carry none.
      #
      # The measurement that forced it to zero rather than to 0.03: with 0.03 m
      # of padding, and after the camera voxel layer and the keepout zones were
      # added, 30 percent of the cells within 0.55 m of the vehicle were lethal
      # or inscribed, and 47 percent within 0.80 m. MPPI considers the real
      # footprint, so nearly every sampled trajectory put it in a blocked cell,
      # it commanded nothing, and the progress checker failed the goal with no
      # safety stop involved.
      #
      # The arithmetic for THIS platform, against the building's measured
      # median corridor of 1.34 m rather than the datasheet figure that was
      # asserted for most of this project's life, see V-22: circumscribed
      # diameter 0.8269 m, so an inscribed radius of 0.2845 m leaves 1.34 - 2 x
      # 0.2845 m of free band in a median aisle.
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      # KEEPOUT ZONES, the permanent no-go areas over the racking.
      #
      # A costmap FILTER rather than a layer, because it is not an observation.
      # Layers describe what has been seen; a filter applies a decision that was
      # made before the vehicle was switched on. The racking is bolted down, its
      # position is on the building drawing, and there is no reason to make the
      # vehicle rediscover it from depth images every run in order to respect it.
      #
      # This does not replace the camera voxel layer, it complements it. The
      # filter states what is permanently forbidden and cannot be argued with by
      # a dirty lens or a sunlit aisle. The cameras handle everything that is
      # not on the drawing: a pallet left in an aisle, a person, an open door.
      #
      # See tools/build_keepout_mask.py for the provenance rules. In short, the
      # mask is commissioning data of the same status as a floor plan; it is NOT
      # the ground truth map, which exists only to score results and must never
      # reach this stack.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        # /map, from slam_toolbox. NOT /ground_truth/map. The vehicle plans on
        # what it has surveyed; the true floorplan exists only to score that.
        map_topic: /map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan                 # the merged two-scanner cloud
          sensor_frame: base_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      voxel_layer:
        # THE CAMERAS, AND WHY NAVIGATION NEEDS THEM.
        #
        # A 2D scanner at 110 mm sees warehouse racking as a row of thin legs
        # with drivable gaps between them, because that is exactly what racking
        # looks like at 110 mm. The planner believed those gaps and the vehicle
        # drove under the shelving and wedged.
        # Measured on the MiR250 build: 0.400 m of clearance against a 0.501 m
        # inscribed radius, every candidate trajectory in collision, stationary
        # for four consecutive survey rounds while the planner produced a fresh
        # valid path every second.
        #
        # Measured on this world, obstacles in the band a PERSON occupies cover
        # 108.7 m2 and obstacles in the band the SCANNER sees cover 16.4 m2.
        # The scanner is blind to about 85 percent of what should block this
        # vehicle. No amount of controller tuning fixes a costmap that does not
        # contain the obstacle.
        #
        # A voxel layer rather than an obstacle layer, because a depth camera
        # needs to CLEAR in three dimensions. A 2D obstacle layer raytraces in
        # the ground plane and cannot tell "nothing there" from "nothing there
        # at this height", so marks from an overhang never clear and the
        # costmap slowly fills with ghosts.
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true       # visible in RViz; this layer is the whole
                                      # reason the vehicle stays out of the racking
        origin_z: 0.0
        z_resolution: 0.10
        # 10 x 0.10 m = 1.00 m, the vehicle envelope height from the platform
        # spec: the deck plus the load it carries.
        z_voxels: 10
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: camera_left camera_right
        camera_left:
          topic: /camera_left/points
          data_type: "PointCloud2"
          # 0.10 m up, so the floor itself is not an obstacle. Up to the
          # vehicle envelope height from the platform spec: the vehicle carries
          # a top module, so what has to clear is the deck plus its load, not
          # the 411 mm chassis. Anything lower than this blocks.
          min_obstacle_height: 0.10
          max_obstacle_height: 1.00
          marking: true
          clearing: true
          obstacle_max_range: 4.0     # D435i is trustworthy well past this, but
                                      # depth noise grows with range and a false
                                      # mark at 8 m closes an aisle
          obstacle_min_range: 0.15    # sheet Min-Z is 0.105 m
          raytrace_max_range: 5.0
          raytrace_min_range: 0.15
        camera_right:
          topic: /camera_right/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.10
          max_obstacle_height: 1.00
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          obstacle_min_range: 0.15
          raytrace_max_range: 5.0
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.4634 m: the circumscribed radius 0.4134 m plus a 0.05 m clearance
        # band, so a planned path leaves room for a person to pass rather than
        # technically fitting. The radius is a platform property; the band is a
        # commissioning decision, stated once in generate_nav2.py and applied
        # to both platforms.
        inflation_radius: 0.4634
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom               # odom, not map: the local window must
                                       # stay smooth through a SLAM loop
                                       # closure, which jumps map -> odom
      robot_base_frame: base_link
      # TF TOLERANCE, and it is what stood between one completed cycle and
      # three. The controller transforms the goal into the costmap frame using
      # THIS tolerance, not the controller's own. Left at the default it aborted
      # goals outright on a 16 millisecond miss:
      #
      #   Lookup would require extrapolation into the future. Requested time
      #   326.928000 but the latest data is at time 326.912000, map to odom
      #   Unable to transform goal pose into costmap frame
      #
      # slam_toolbox already republishes map to odom at 50 Hz, so this is
      # ordinary scheduling jitter between a request for "now" and the last
      # transform to land, not a stale transform. The tolerance makes the lookup
      # wait those few milliseconds instead of failing the whole goal. The
      # failure signature was unmistakable once seen: always about 8 seconds,
      # always the same leg, never with anything in the way.
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      # 5 m square. At 0.75 m/s with the MPPI horizon at 56 steps of 0.05 s,
      # the vehicle looks 2.80 s and so 2.10 m ahead, and the window has to
      # hold that in front of it and the same behind, plus room for a
      # pedestrian approaching from the side.
      #
      # Rounded UP to a whole metre, never down: a window shorter than the
      # horizon lets the controller score trajectories against cells it has no
      # data for.
      width: 5
      height: 5
      resolution: 0.05
      # The same footprint the global costmap uses; see the note there. The two
      # must agree, and a test asserts it: a vehicle that is one size globally
      # and another locally plans paths it then cannot follow.
      footprint: "[[0.3000, 0.2845], [0.3000, -0.2845], [-0.3000, -0.2845], [-0.3000, 0.2845]]"
      # ZERO PADDING, and the argument for it is the argument that was first
      # made against raising it.
      #
      # Nav2 treats a cell as blocked once it is within the INSCRIBED radius of
      # an obstacle, which for this footprint is 0.2845 m. Padding adds to that
      # radius, so it is a HARD CONSTRAINT, and the following was measured on
      # the MiR250 build by moving it in both directions.
      #
      # Too little: with 0.02 m the planner threaded a gap that cleared the
      # vehicle by 9 mm, which survives neither map noise nor localisation
      # drift. It followed that path into a pocket with 0.450 m of true
      # clearance, below its own inscribed radius, where every candidate
      # trajectory is in collision and it cannot move in any direction.
      #
      # Too much: 0.08 m took the effective inscribed radius to 0.613 m, and
      # this warehouse has real, drivable positions with 0.550 m of clearance.
      # The vehicle drove to one of them perfectly well and the planner then
      # declared its own position blocked, which is a worse failure than the one
      # the padding was meant to cure.
      #
      # So padding cannot express "prefer roomy routes", and the MISSION layer
      # carries that preference instead: the survey only ever targets floor with
      # 0.70 m of clearance and only routes itself through such floor. If the
      # mission layer carries the margin, the planner should carry none.
      #
      # The measurement that forced it to zero rather than to 0.03: with 0.03 m
      # of padding, and after the camera voxel layer and the keepout zones were
      # added, 30 percent of the cells within 0.55 m of the vehicle were lethal
      # or inscribed, and 47 percent within 0.80 m. MPPI considers the real
      # footprint, so nearly every sampled trajectory put it in a blocked cell,
      # it commanded nothing, and the progress checker failed the goal with no
      # safety stop involved.
      #
      # The arithmetic for THIS platform, against the building's measured
      # median corridor of 1.34 m rather than the datasheet figure that was
      # asserted for most of this project's life, see V-22: circumscribed
      # diameter 0.8269 m, so an inscribed radius of 0.2845 m leaves 1.34 - 2 x
      # 0.2845 m of free band in a median aisle.
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      # KEEPOUT ZONES, the permanent no-go areas over the racking.
      #
      # A costmap FILTER rather than a layer, because it is not an observation.
      # Layers describe what has been seen; a filter applies a decision that was
      # made before the vehicle was switched on. The racking is bolted down, its
      # position is on the building drawing, and there is no reason to make the
      # vehicle rediscover it from depth images every run in order to respect it.
      #
      # This does not replace the camera voxel layer, it complements it. The
      # filter states what is permanently forbidden and cannot be argued with by
      # a dirty lens or a sunlit aisle. The cameras handle everything that is
      # not on the drawing: a pallet left in an aisle, a person, an open door.
      #
      # See tools/build_keepout_mask.py for the provenance rules. In short, the
      # mask is commissioning data of the same status as a floor plan; it is NOT
      # the ground truth map, which exists only to score results and must never
      # reach this stack.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: base_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      voxel_layer:
        # THE CAMERAS, AND WHY NAVIGATION NEEDS THEM.
        #
        # A 2D scanner at 110 mm sees warehouse racking as a row of thin legs
        # with drivable gaps between them, because that is exactly what racking
        # looks like at 110 mm. The planner believed those gaps and the vehicle
        # drove under the shelving and wedged.
        # Measured on the MiR250 build: 0.400 m of clearance against a 0.501 m
        # inscribed radius, every candidate trajectory in collision, stationary
        # for four consecutive survey rounds while the planner produced a fresh
        # valid path every second.
        #
        # Measured on this world, obstacles in the band a PERSON occupies cover
        # 108.7 m2 and obstacles in the band the SCANNER sees cover 16.4 m2.
        # The scanner is blind to about 85 percent of what should block this
        # vehicle. No amount of controller tuning fixes a costmap that does not
        # contain the obstacle.
        #
        # A voxel layer rather than an obstacle layer, because a depth camera
        # needs to CLEAR in three dimensions. A 2D obstacle layer raytraces in
        # the ground plane and cannot tell "nothing there" from "nothing there
        # at this height", so marks from an overhang never clear and the
        # costmap slowly fills with ghosts.
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true       # visible in RViz; this layer is the whole
                                      # reason the vehicle stays out of the racking
        origin_z: 0.0
        z_resolution: 0.10
        # 10 x 0.10 m = 1.00 m, the vehicle envelope height from the platform
        # spec: the deck plus the load it carries.
        z_voxels: 10
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: camera_left camera_right
        camera_left:
          topic: /camera_left/points
          data_type: "PointCloud2"
          # 0.10 m up, so the floor itself is not an obstacle. Up to the
          # vehicle envelope height from the platform spec: the vehicle carries
          # a top module, so what has to clear is the deck plus its load, not
          # the 411 mm chassis. Anything lower than this blocks.
          min_obstacle_height: 0.10
          max_obstacle_height: 1.00
          marking: true
          clearing: true
          obstacle_max_range: 4.0     # D435i is trustworthy well past this, but
                                      # depth noise grows with range and a false
                                      # mark at 8 m closes an aisle
          obstacle_min_range: 0.15    # sheet Min-Z is 0.105 m
          raytrace_max_range: 5.0
          raytrace_min_range: 0.15
        camera_right:
          topic: /camera_right/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.10
          max_obstacle_height: 1.00
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          obstacle_min_range: 0.15
          raytrace_max_range: 5.0
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # See the global costmap's inflation layer for the derivation.
        inflation_radius: 0.4634
        cost_scaling_factor: 3.0

# ---- Costmap filters ------------------------------------------------------
# Two nodes rather than one, because nav2 separates the DATA from its meaning.
# The mask server publishes the picture; the info server says how to read it,
# so the same mask could be reused as a speed-limit zone by changing `type`.

filter_mask_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    # Authored against the SURVEYED map, so it shares its frame and origin.
    # Re-survey the building and this must be re-authored: that is a real
    # commissioning step, not an oversight.
    yaml_filename: "keepout_mask.yaml"

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 0                      # 0 keepout, 1 speed limit as a percentage,
                                 # 2 speed limit as an absolute value
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
