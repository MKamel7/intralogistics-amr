# ros_gz_bridge configuration for a single un-namespaced robot.
#
# Only what is consumed is bridged. Every bridged topic costs a serialisation
# on a 15 W CPU, and Gazebo renders a camera ONLY while its topic has a
# subscriber, so an unused bridge entry is not free: it makes the simulator
# render frames nobody reads. See docs/adr/0003-three-tier-simulation.md.
#
# THE CAMERA POINT CLOUDS ARE BRIDGED, and they were not always. They are the
# most expensive payload here, and the earlier judgement that nothing consumed
# them was simply wrong: without them the vehicle navigates on a single 150 mm
# scan plane, which cannot represent its drivable space.
#
# Measured on this world, geometry occupying the band a person walks through
# covers 108.7 m2, and the band the SCANNER sees covers 16.4 m2. Warehouse
# racking stands on legs, so at 150 mm it reads as a row of thin posts with
# generous gaps between them. The planner routed straight into one of those
# gaps and the vehicle wedged underneath the shelving at 0.400 m clearance
# against its own 0.501 m inscribed radius, unable to move in any direction.
#
# The clouds feed the costmap only. They are NOT a safety input: the collision
# monitor stays on the rated scanner. See docs/adr/0005.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ---- safety laser scanners -------------------------------------------
- ros_topic_name: "/scanner_front_left/scan"
  gz_topic_name: "/scanner_front_left/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/scanner_rear_right/scan"
  gz_topic_name: "/scanner_rear_right/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# ---- IMU --------------------------------------------------------------
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ---- RGB-D cameras ----------------------------------------------------
- ros_topic_name: "/camera_left/image"
  gz_topic_name: "/camera_left/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_left/depth_image"
  gz_topic_name: "/camera_left/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_left/camera_info"
  gz_topic_name: "/camera_left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_right/image"
  gz_topic_name: "/camera_right/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_right/depth_image"
  gz_topic_name: "/camera_right/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_right/camera_info"
  gz_topic_name: "/camera_right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ---- Depth point clouds -------------------------------------------------
# Consumed by the voxel layer in both costmaps so the planner sees structure
# above the scan plane. Navigation input, never a safety input.
- ros_topic_name: "/camera_left/points"
  gz_topic_name: "/camera_left/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_right/points"
  gz_topic_name: "/camera_right/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
