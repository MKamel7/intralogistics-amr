name: CI

on:
  push:
  pull_request:

jobs:
  # Fast gate: no ROS, no simulator. Catches provenance and spec drift in
  # seconds so the slow job is not the first thing to tell you.
  checks:
    name: lint and spec gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pytest pyyaml ruff
      - name: Lint
        run: ruff check src
      # EVERY GENERATOR GATE, not just the provenance one. These four files
      # need no ROS and run in seconds, and between them they assert that the
      # platform specs keep their sources, that the protective fields match
      # their generator, that the Nav2 configuration matches its generator and
      # template, and that the mission cannot widen the envelope the generator
      # derived. Three of the four exist because a real fault got through.
      - name: Generator and provenance gates
        run: |
          python3 -m pytest -q \
            src/amr_description/test/test_platform_spec.py \
            src/amr_safety/test/test_fields.py \
            src/amr_navigation/test/test_nav2_config.py \
            src/amr_mission/test/test_transport_limits.py \
            src/amr_sim/test/test_test_track.py \
            src/amr_evaluation/test/test_experiment.py

  build:
    name: colcon build and test
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: . /opt/ros/jazzy/setup.bash && colcon build --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
