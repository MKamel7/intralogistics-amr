name: CI

on:
  push:
  pull_request:

jobs:
  # Fast gate: no ROS, no simulator. Catches provenance and spec drift in
  # seconds so the slow job is not the first thing to tell you.
  checks:
    name: lint and spec gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pytest==8.3.4 pyyaml==6.0.2 ruff==0.15.20
      # `ruff check src` left the repository's other 5,753 lines of Python
      # unlinted: tools/ holds the filming and demo-cutting pipeline, which is
      # what produced docs/media/demo.mp4, so it is the code a reader is most
      # likely to run after the README and the least likely to have been
      # checked. It is listed explicitly rather than linting `.` so a new
      # top-level directory has to be added here deliberately.
      - name: Lint
        run: ruff check src tools
      # EVERY GENERATOR GATE, not just the provenance one. These files need no
      # ROS and run in seconds, and between them they assert that the platform
      # specs keep their sources, that the protective fields match their
      # generator, that the Nav2 configuration matches its generator and
      # template, and that the load is set down at the last stop rather than the
      # first. Most of them exist because a real fault got through.
      #
      # test_transport_limits.py is NOT here, deliberately: it imports
      # ament_index_python, which this job does not install, so it failed
      # collection and took the whole gate down with it (exit code 2) rather
      # than reporting on the files that can run. It is registered in
      # amr_mission/CMakeLists.txt and runs under `colcon test` in the job
      # below, where ROS exists, so no coverage is lost by leaving it out here.
      - name: Generator and provenance gates
        run: |
          python3 -m pytest -q \
            src/amr_description/test/test_platform_spec.py \
            src/amr_safety/test/test_fields.py \
            src/amr_navigation/test/test_nav2_config.py \
            src/amr_mission/test/test_route.py \
            src/amr_sim/test/test_test_track.py \
            src/amr_evaluation/test/test_experiment.py

  build:
    name: colcon build and test
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: . /opt/ros/jazzy/setup.bash && colcon build --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
